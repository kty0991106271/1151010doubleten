<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙十國慶 慶祝中華民國生日快樂</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #002B49 0%, #D90011 100%);
      color: #FFFFFF;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 80%;
    }
    h1 { font-size: 2.8rem; margin-bottom: 10px; color: #FFD700; }
    h2 { font-size: 1.8rem; font-weight: 400; margin-top: 0; }
    p { font-size: 1.2rem; line-height: 1.6; }
    button {
      background-color: #FFD700;
      color: #002B49;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇹🇼 1010 雙十國慶 🇹🇼</h1>
    <h2>熱烈慶祝 中華民國 生日快樂！</h2>
    <p>攜手同心，璀璨國慶。<br>願國運昌隆、歲月靜好！</p>
    <button onclick="triggerConfetti()">施放慶祝煙火 🎉</button>
  </div>

  <script>
    // 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('PWA Service Worker 註冊成功'))
        .catch(err => console.error('SW 註冊失敗:', err));
    }

    function triggerConfetti() {
      alert("🎉 歡慶雙十！祝福中華民國 國運昌隆、生日快樂！ 🇹🇼");
    }
  </script>
</body>
</html>
